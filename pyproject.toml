[project]
name = "noadb-emu-mcp"
version = "0.1.1"
description = "Local no-ADB MCP controller for LDPlayer and MuMu"
requires-python = ">=3.11"
dependencies = ["mcp>=1.30,<2", "Pillow>=12,<13"]

[project.scripts]
emulator-agent = "emulator_agent.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["emulator_agent*"]
